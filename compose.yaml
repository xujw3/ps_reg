services:
  ps-register:
    image: ${PS_REGISTER_IMAGE:-ps-register:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ps-register
    init: true
    restart: unless-stopped
    ports:
      - "${PS_WEB_PORT:-8787}:8787"
    environment:
      TZ: ${TZ:-UTC}
      PS_WEB_COOKIE_SECURE: ${PS_WEB_COOKIE_SECURE:-0}
      PS_FORCE_HEADED: "1"
      PS_CONFIG_FILE: /app/data/config.json
      PS_DOCKER_PROXY_HOST: host.docker.internal
      XVFB_SCREEN: ${XVFB_SCREEN:-1920x1080x24}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    shm_size: ${PS_SHM_SIZE:-1gb}
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
